    <!--
      Apply theme and motion preferences before first paint, so there's no flash
      of the wrong theme and no animation that starts only to be paused.
        theme:  saved choice → OS preference (only if it explicitly asks for light) → dark
        motion: saved choice → paused if the OS asks for reduced motion → playing
      ThemeService and MotionService adopt these attributes; keep the keys in sync.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        function saved(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        function prefers(query) {
          return !!window.matchMedia && window.matchMedia(query).matches;
        }
        var theme = saved('theme');
        root.setAttribute(
          'data-theme',
          theme === 'light' || theme === 'dark' ? theme : prefers('(prefers-color-scheme: light)') ? 'light' : 'dark'
        );
        var motion = saved('motion');
        root.setAttribute(
          'data-motion',
          motion === 'playing' || motion === 'paused' ? motion : prefers('(prefers-reduced-motion: reduce)') ? 'paused' : 'playing'
        );
      })();
    </script>
